name: 问题反馈
description: 报告 scnterm 的异常行为
body:
  - type: input
    id: environment
    attributes:
      label: 系统与 CPU 架构
      placeholder: 例如 Windows 11 x64、Ubuntu 26.04 x64、macOS Apple Silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 填写 wezterm --version 的输出，或构建对应的提交编号。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 描述操作步骤、实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 提供能够复现问题的 Lua 配置；使用默认配置时填写“默认配置”。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可附上终端输出、错误日志或截图。
