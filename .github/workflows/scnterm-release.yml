  windows:
    if: github.repository == 'scnabla/scnterm' && github.ref == 'refs/heads/personal'
    name: windows
    needs: validate
    runs-on: "windows-2025"
    timeout-minutes: 120
    env:
      BUILD_REASON: "Schedule"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
      CARGO_BUILD_JOBS: "3"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          persist-credentials: false
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "scnterm-windows-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Build wezterm (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --locked -p wezterm --release
      - name: "Build wezterm-gui (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --locked -p wezterm-gui --release
      - name: "Build wezterm-mux-server (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --locked -p wezterm-mux-server --release
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --locked -p strip-ansi-escapes --release
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "windows"
      - name: "Test"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo nextest run --locked --all --no-fail-fast
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "整理下载文件"
        shell: bash
        run: "python ci/prepare-release-assets.py windows"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "windows"
          path: "release-assets/*"
          retention-days: 5
          if-no-files-found: "error"

  publish:
    name: 更新 Release
    needs: [ubuntu22_04, ubuntu24_04, ubuntu26_04, windows]
    if: github.repository == 'scnabla/scnterm' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: scnterm-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: 校验产物并更新固定 Release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLATFORMS: ubuntu26.04,windows
        run: python3 ci/publish-scnterm-release.py release-artifacts
