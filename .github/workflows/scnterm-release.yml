# 由 ci/generate-scnterm-workflow.py 生成。
name: scnterm 自动构建与发布

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 检查发布脚本与工作流
    if: github.repository == 'scnabla/scnterm' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s ci/tests -p 'test_scnterm_*.py' -v
      - run: python3 -B ci/generate-scnterm-workflow.py
      - run: git diff --exit-code -- .github/workflows/scnterm-release.yml
  ubuntu22_04:
    if: github.repository == 'scnabla/scnterm' && github.ref == 'refs/heads/personal'
    name: ubuntu22.04
    needs: validate
    runs-on: "ubuntu-latest"
    timeout-minutes: 120
    container: "ubuntu:22.04"
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_BUILD_JOBS: "3"

    steps:
      - name: "set APT to non-interactive"
        shell: bash
        run: "echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections"
      - name: "Update APT"
        shell: bash
        run: "apt update"
      - name: "Install git"
        shell: bash
        run: "apt-get install -y git"
      - name: "Install curl"
        shell: bash
        run: "apt-get install -y curl"
      - name: "Update APT"
        shell: bash
        run: "apt update"
      - name: "Ensure /run/sshd exists"
        shell: bash
        run: "mkdir -p /run/sshd"
      - name: "Install openssh-server"
        shell: bash
        run: "apt-get install -y openssh-server"
      - name: "Workaround git permissions issue"
        shell: bash
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          persist-credentials: false
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "scnterm-ubuntu22.04-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build wezterm (Release mode)"
        shell: bash
        run: "cargo build --locked -p wezterm --release"
      - name: "Build wezterm-gui (Release mode)"
        shell: bash
        run: "cargo build --locked -p wezterm-gui --release"
      - name: "Build wezterm-mux-server (Release mode)"
        shell: bash
        run: "cargo build --locked -p wezterm-mux-server --release"
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: bash
        run: "cargo build --locked -p strip-ansi-escapes --release"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "ubuntu22.04"
      - name: "Test"
        shell: bash
        run: "cargo nextest run --locked --all --no-fail-fast"
      - name: "Test wezterm-escape-parser (no_std)"
        shell: bash
        run: "cargo nextest run --locked -p wezterm-escape-parser"

